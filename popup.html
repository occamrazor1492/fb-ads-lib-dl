<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ads Library Media Saver</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main class="shell">
      <section class="panel">
        <div class="brand">
          <div class="mark" aria-hidden="true">A</div>
          <div>
            <h1>Ads Library Media Saver</h1>
            <p id="statusText">Ready on the current Ads Library tab.</p>
          </div>
        </div>

        <div class="controls">
          <button id="scanCurrentBtn" type="button">Add page buttons</button>
          <button id="openLibraryBtn" type="button" class="secondary">Library</button>
        </div>
      </section>

      <section class="panel results" id="resultsPanel" hidden>
        <div class="resultsHead">
          <h2>Detected media</h2>
          <button id="downloadBestBtn" type="button" class="secondary" disabled>Best MP4</button>
        </div>
        <div id="summary" class="summary"></div>
        <div id="mediaList" class="mediaList"></div>
      </section>

      <section class="notice">
        Buttons appear beside visible Ads Library media. Saved items stay local unless you connect Google Drive.
      </section>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
